version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robinson-crusoe-api
    ports:
      - "8000:8000"
    environment:
      # Server settings
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=false

      # CORS settings
      - ALLOWED_ORIGINS=*

      # Model paths (inside container)
      - MODEL_PATH=/app/models/final_model.keras

      # Text processing
      - MIN_TEXT_LENGTH=50
      - MAX_TEXT_LENGTH=1000000
      - MAX_BATCH_SIZE=100

      # Cache settings
      - CACHE_EMBEDDINGS=true
      - EMBEDDINGS_CACHE_PATH=/app/data/cache

      # Logging
      - LOG_LEVEL=INFO

    volumes:
      # Mount models directory for easy updates
      - ./models:/app/models:ro

      # Mount cache directory for persistence
      - ./data/cache:/app/data/cache

      # Mount logs directory
      - ./logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: robinson-crusoe-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - production

networks:
  default:
    name: robinson-crusoe-network
