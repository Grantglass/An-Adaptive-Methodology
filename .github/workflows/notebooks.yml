name: Notebook Validation

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Notebooks/**/*.ipynb'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'Notebooks/**/*.ipynb'

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nbformat nbconvert jupyter

    - name: Validate notebook syntax
      run: |
        for notebook in Notebooks/*.ipynb; do
          echo "Validating $notebook"
          jupyter nbconvert --to notebook --execute --inplace "$notebook" --ExecutePreprocessor.timeout=60 || echo "Warning: $notebook failed to execute"
        done
      continue-on-error: true

    - name: Check for notebook outputs
      run: |
        echo "Checking for committed outputs in notebooks..."
        for notebook in Notebooks/*.ipynb; do
          if grep -q '"outputs": \[' "$notebook"; then
            echo "Warning: $notebook contains outputs"
          fi
        done
      continue-on-error: true

  notebook-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install nbqa and linting tools
      run: |
        python -m pip install --upgrade pip
        pip install nbqa black flake8 isort

    - name: Lint notebooks with nbqa
      run: |
        nbqa flake8 Notebooks/ --exit-zero
        nbqa black --check Notebooks/ || echo "Formatting issues in notebooks"
      continue-on-error: true
